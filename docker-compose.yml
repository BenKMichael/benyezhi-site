
services:
  web:
    build:
      context: ./benyezhi.site
      dockerfile: Dockerfile
    container_name: cse135
    ports:
      - "8080:80"
    volumes:
      - ./benyezhi.site/html:/var/www/html:ro
      - ./benyezhi.site/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      - auth
      - reporting
    restart: unless-stopped

  auth:
    build:
      context: ./reporting.benyezhi.site/auth
    container_name: cse135-auth
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
    env_file:
      - ./reporting.benyezhi.site/auth/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  reporting:
    build:
      context: ./reporting.benyezhi.site/reporting
    container_name: cse135-reporting
    ports:
      - "3002:3002"
    volumes:
      - /app/node_modules
    env_file:
      - ./reporting.benyezhi.site/reporting/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: ./collector.benyezhi.site/node-app
    container_name: cse135-collector
    ports:
      - "3001:3001"
    volumes:
      - /app/node_modules
    env_file:
      - ./collector.benyezhi.site/node-app/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: mysql_service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: analytics_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
