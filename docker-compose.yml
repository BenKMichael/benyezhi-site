services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cse135
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    restart: unless-stopped

  node:
    build:
      context: ./node-app
    container_name: cse135-node
    volumes:
      - ./node-app:/app
      - /app/node_modules
    restart: unless-stopped
  
  reporting:
    build:
      context: ./reporting.benyezhi.site/node-app/
      dockerfile: Dockerfile
    container_name: reporting-site
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  collector:
    build:
      context: ./collector.benyezhi.site/node-app/
      dockerfile: Dockerfile
    container_name: collector-site
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always