services:
  web:
    build:
      context: ./benyezhi.site
      dockerfile: Dockerfile
    container_name: cse135
    ports:
      - "8080:80"
      - "8081:81"
      - "8082:82"
    volumes:
      - ./benyezhi.site/html:/var/www/html:ro
      - ./collector.benyezhi.site:/var/www/collector:ro
      - ./benyezhi.site/apache.conf:/etc/apache2/sites-available/000-default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./app
    container_name: cse135-app
    ports:
      - "3000:3000"
    env_file:
      - ./app/.env.example
    depends_on:
      mysql-db:
        condition: service_healthy
    restart: unless-stopped

  mysql-db:
    image: mysql:8.0
    container_name: mysql_service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: analytics_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql_data:
