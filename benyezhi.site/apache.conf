ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On
    ProxyPass /node/ http://auth:3000/
    ProxyPassReverse /node/ http://auth:3000/

    ProxyPass /reporting/ http://reporting:3002/
    ProxyPassReverse /reporting/ http://reporting:3002/

    # dashboard.js's fetch('/api/...') calls are relative to whatever
    # origin the page itself loaded from -- an absolute path like /api/...
    # resolves against this vhost's root regardless of the /node/ prefix
    # the dashboard page is served under, so this needs to sit at the top
    # level here too, same as reporting.benyezhi.site's production vhost.
    ProxyPass /api http://reporting:3002/api
    ProxyPassReverse /api http://reporting:3002/api

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ScriptAlias /cgi-bin/ /usr/bin/cgi-bin/
    <Directory "/usr/bin/cgi-bin">
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        Require all granted
    </Directory>
</VirtualHost>