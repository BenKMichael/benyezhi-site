name: Deploy Reporting Services

on:
  push:
    branches:
      - main
    paths:
      - 'reporting.benyezhi.site/auth/**'
      - 'reporting.benyezhi.site/reporting/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy auth folder to DEPLOY via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "reporting.benyezhi.site/auth/*"
          target: "/var/www/reporting.benyezhi.site/auth"
          strip_components: 1

      - name: Copy reporting folder to DEPLOY via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "reporting.benyezhi.site/reporting/*"
          target: "/var/www/reporting.benyezhi.site/reporting"
          strip_components: 1

      - name: Install dependencies & Restart PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          AUTH_ENV: ${{ secrets.AUTH_ENV }}
          REPORTING_ENV: ${{ secrets.REPORTING_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: AUTH_ENV,REPORTING_ENV
          script: |
            cd /var/www/reporting.benyezhi.site/auth
            echo "$AUTH_ENV" > .env
            chmod 600 .env
            npm install --omit=dev
            pm2 delete reporting-auth || true
            pm2 start app.js --name reporting-auth
            pm2 save

            cd /var/www/reporting.benyezhi.site/reporting
            echo "$REPORTING_ENV" > .env
            chmod 600 .env
            npm install --omit=dev
            pm2 delete reporting-api || true
            pm2 start server.js --name reporting-api
            pm2 save
