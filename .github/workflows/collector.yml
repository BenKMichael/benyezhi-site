name: Collector Front-end

on:
  push:
    branches:
      - main
    paths:
      - 'collector.benyezhi.site/**'
  workflow_dispatch:

jobs:
  build-collector:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "collector.benyezhi.site/*"
          target: "/var/www/collector.benyezhi.site/"
          strip_components: 1

      - name: Install dependencies & restart PM2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          COLLECTOR_ENV: ${{ secrets.COLLECTOR_ENV }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: COLLECTOR_ENV
          script: |
            cd /var/www/collector.benyezhi.site/node-app
            echo "$COLLECTOR_ENV" > .env
            chmod 600 .env
            npm install --omit=dev
            pm2 delete collector-api || true
            pm2 start server.js --name collector-api
            pm2 save
