name: Deploy to Server

on:
  push:
    branches:
      - main
    paths:
      - 'benyezhi.site/html/**'
      - 'benyezhi.site/perl-cgi/**'
      - 'benyezhi.site/php-cgi/**'
      - 'benyezhi.site/go-cgi/**'
      - 'benyezhi.site/node-app/**'


jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Build GO CGI Binaries
        run: |
          mkdir -p go_output
          if [ -d "benyezhi.site/go-cgi" ]; then
            cd benyezhi.site/go-cgi
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../../go_output/ ./cmd/...
            cd ../../go_output
            for bin in *; do
              if [ -f "$bin" ] && [[ "$bin" != *.cgi ]]; then
                mv "$bin" "go-${bin}.cgi"
              fi
            done
            cd ../
          else
            echo "Warning: benyezhi.site/go-cgi directory not found!"
          fi
      - name: Build Artifacts
        run: |
          mkdir -p deploy_pkg/html
          mkdir -p deploy_pkg/cgi-bin

          # copy static files
          if [ -d "benyezhi.site/html" ]; then
            cp -r benyezhi.site/html/. deploy_pkg/html/
            echo "Copied static files."
          fi

          # copy perl files
          if [ -d "benyezhi.site/perl-cgi" ]; then
            cp -r benyezhi.site/perl-cgi/. deploy_pkg/cgi-bin/
            echo "Copied perl files."
          fi

          # copy php files
          if [ -d "benyezhi.site/php-cgi" ]; then
            cp -r benyezhi.site/php-cgi/. deploy_pkg/cgi-bin/
            echo "Copied PHP files."
          fi

          # copy go files
          cp -r go_output/. deploy_pkg/cgi-bin/

          # copy node app files
          if [ -d "benyezhi.site/node-app" ]; then
            mkdir -p deploy_pkg/node-app
            cp -r benyezhi.site/node-app/. deploy_pkg/node-app/
            echo "Copied Node.js app files."
          fi

      - name: Deploy via SSH
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          SOURCE: "deploy_pkg/"
          TARGET: "/tmp/deploy_pkg"
          SCRIPT_AFTER: |
            echo "Copying files as non-root user..."
            mkdir -p /var/www/html/cgi-bin
            cp -r /tmp/deploy_pkg/html/* /var/www/html/
            cp -r /tmp/deploy_pkg/cgi-bin/* /var/www/html/cgi-bin/
            chmod +x /var/www/html/cgi-bin/*

            echo "Deploying Node.js app..."
            mkdir -p ~/benyezhi-site/node-app
            cp -r /tmp/deploy_pkg/node-app/* ~/benyezhi-site/node-app/
            cd ~/benyezhi-site/node-app
            npm ci --omit=dev
            pm2 restart node-app || pm2 start server.js --name node-app
            pm2 save

            rm -rf /tmp/deploy_pkg
            echo "Deploy finished!"

